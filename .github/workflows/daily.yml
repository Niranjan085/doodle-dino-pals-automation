name: Daily Dino Shorts

on:
  workflow_dispatch:
  schedule:
    # 09:00 India Standard Time (UTC+05:30)
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate story scripts
        run: python daily_shorts.py

      - name: Generate English and Hindi voiceovers
        run: python generate_voice.py

      - name: Render vertical bilingual MP4 videos
        run: python video_renderer.py

      - name: Verify generated videos
        run: |
          set -e
          count=$(find output -maxdepth 1 -type f -name 'short_*.mp4' | wc -l)
          test "$count" -gt 0
          for video in output/short_*.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video"
            test -s "$video"
          done
          ls -lh output/short_*.mp4

      - name: Upload generated videos and source files
        uses: actions/upload-artifact@v4
        with:
          name: dino-shorts-output
          path: output/
          if-no-files-found: error
          retention-days: 7
