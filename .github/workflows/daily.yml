name: Daily Dino Shorts

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 09:00 India Standard Time (UTC+05:30)
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: daily-dino-shorts
  cancel-in-progress: true

jobs:
  generate-shorts:
    name: Generate and verify bilingual Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DINO_QUALITY: 4k
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and fonts
        timeout-minutes: 15
        run: |
          # GitHub-hosted Ubuntu runners already have package indexes and FFmpeg;
          # install only the missing render engine and fonts to avoid a slow apt update.
          command -v ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg
          sudo apt-get install -y --no-install-recommends blender fonts-noto-core fonts-dejavu-core
          ffmpeg -version
          ffprobe -version
          blender --version | head -n 2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run software tests
        run: python -m unittest discover -s tests -v

      - name: Prepare clean output folder
        run: |
          rm -rf output
          mkdir -p output

      - name: Generate story scripts
        run: python daily_shorts.py

      - name: Generate English and Hindi voiceovers
        run: python generate_voice.py

      - name: Render genuine 3D animated vertical MP4 videos
        run: python video_renderer.py

      - name: Verify every generated video
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          import re
          videos = sorted(
              p for p in Path("output").glob("short_*.mp4")
              if re.fullmatch(r"short_[0-9]+\.mp4", p.name)
          )
          if len(videos) != 3:
              raise SystemExit(f"Expected 3 MP4 videos, found {len(videos)}")

          report = []
          for video in videos:
              result = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries",
                   "format=duration:stream=codec_type,width,height",
                   "-of", "json", str(video)],
                  check=True, capture_output=True, text=True,
              )
              metadata = json.loads(result.stdout)
              streams = metadata.get("streams", [])
              video_stream = next((s for s in streams if s.get("codec_type") == "video"), None)
              audio_stream = next((s for s in streams if s.get("codec_type") == "audio"), None)
              duration = float(metadata["format"]["duration"])
              if not video_stream or not audio_stream:
                  raise SystemExit(f"{video} is missing video or audio")
              if video_stream.get("width") != 2160 or video_stream.get("height") != 3840:
                  raise SystemExit(f"{video} is not native 4K 2160x3840")
              if not 5 <= duration <= 180:
                  raise SystemExit(f"{video} has invalid duration: {duration:.1f}s")
              if video.stat().st_size < 100_000:
                  raise SystemExit(f"{video} is unexpectedly small")
              report.append({"file": str(video), "duration_seconds": round(duration, 1),
                             "size_bytes": video.stat().st_size})
          Path("output/validation-report.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY
          ls -lh output/

      - name: Upload generated videos and validation report
        uses: actions/upload-artifact@v4
        with:
          name: dino-shorts-output
          path: output/short_[0-9]*.mp4
          if-no-files-found: error
          retention-days: 7
