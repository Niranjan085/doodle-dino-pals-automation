import asyncio
import json
from pathlib import Path
import edge_tts

OUT = Path("output")

VOICES = {
    "en": "en-IN-NeerjaNeural",
    "hi": "hi-IN-SwaraNeural"
}

async def main():
    files = sorted(OUT.glob("short_*.json"))

    if not files:
        raise FileNotFoundError("No scripts found")

    for f in files:
        data = json.loads(f.read_text(encoding="utf-8"))
        scenes = data.get("scenes", [])

        fallback = data.get("description") or data.get("title") or "Let's learn and have fun!"

        for n, scene in enumerate(scenes, 1):
            for lang, voice in VOICES.items():
                if not isinstance(scene, dict):
                    text = str(scene).strip() or fallback
                else:
                    alias = "english" if lang == "en" else "hindi"
                    text = (
                        scene.get(lang)
                        or scene.get(alias)
                        or scene.get("text")
                        or (fallback if lang == "en" else scene.get("en") or fallback)
                    )

                target = OUT / f"{f.stem}_scene{n}_{lang}.mp3"

                await edge_tts.Communicate(
                    str(text), voice=voice
                ).save(str(target))

                print("Created", target)

if __name__ == "__main__":
    asyncio.run(main())
