
name: Daily Doodle Dino Pals Videos

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install edge-tts pillow

      - name: Generate scripts
        run: python daily_shorts.py

      - name: Generate bilingual narration
        run: python generate_voice.py

      - name: Create MP4 videos
        run: python video_renderer.py

      - name: Save finished videos
        uses: actions/upload-artifact@v4
        with:
          name: doodle-dino-pals-daily-videos
          path: output/
          retention-days: 14
